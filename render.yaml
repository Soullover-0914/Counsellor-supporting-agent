# Agent 66 — Render Blueprint
# Deploy: https://dashboard.render.com/select-repo?type=blueprint
#
# IMPORTANT:
# - Persistent Disk requires a paid instance plan (not free).
# - Keep DATABASE_ENCRYPTION_KEY stable across redeploys or the DB cannot open.
# - First boot seeds demo data once; later redeploys preserve /var/data.

services:
  - type: web
    name: agent66-counselling
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /health
    disk:
      name: agent66-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: AUTH_SECRET_KEY
        generateValue: true
      - key: DATABASE_ENCRYPTION_KEY
        generateValue: true
      - key: TOKEN_EXPIRY_SECONDS
        value: "3600"
      - key: DATABASE_PATH
        value: /var/data/counselling_agent_encrypted.db
      - key: FRONTEND_DIST
        value: /app/frontend/dist
      - key: SEED_DEMO_USERS
        value: "true"
      - key: APP_LOGIN_URL
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: "http://127.0.0.1:5173,http://localhost:5173"
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_FROM_EMAIL
        sync: false
      - key: BREVO_FROM_NAME
        value: Agent 66
      - key: EMAIL_ADMIN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
